name: Release Python wheels

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write    # required for PyPI trusted publisher OIDC
  contents: read

jobs:
  build-wheels:
    name: Build wheels for ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          # Linux aarch64 (ARM64): Docker-on-Apple-Silicon, AWS Graviton
          # / Azure / GCP / Oracle ARM VMs, Raspberry Pi 4/5. Built on a
          # NATIVE GitHub-hosted ARM runner (ubuntu-24.04-arm, GA 2025) —
          # ~4 min, same as x86. The earlier QEMU-emulation approach
          # (build aarch64 on an x86 host) took ~50 min per release;
          # native runners eliminate that. No setup-qemu step needed.
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macOS Intel (macos-13 / x86_64) intentionally dropped:
          # GitHub-hosted Intel Mac runners are heavily oversubscribed
          # (queued > 30 min on the 0.2.0 release attempt). Apple is
          # sunsetting Intel; users on Intel Macs install from sdist
          # (`pip install --no-binary rustdl rustdl`) which compiles
          # from source. Re-add if a customer needs prebuilt Intel.
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: 'cp310-*'   # abi3 wheel — one build, all 3.10+ Pythons
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: 'build'
          # Manylinux containers ship without Rust; maturin's auto-install
          # via puccinialin breaks on FileNotFoundError. Install rustup
          # explicitly before each wheel build, scoped per-container.
          # macOS / Windows runners already have Rust available; the
          # _LINUX-suffix env vars only apply to Linux jobs.
          #
          # Profile MUST be `default` (not `minimal`): maturin's internal
          # rustup invocation tries to add rustfmt/clippy components,
          # and a `minimal` install conflicts on the cargo-fmt binary
          # ("rustfmt-preview ... detected conflict: 'bin/cargo-fmt'").
          # `default` ships those components from the start, so no
          # subsequent add-component conflict.
          CIBW_BEFORE_ALL_LINUX: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile default
          # RUSTUP_TOOLCHAIN=stable pins the wheel build to the stable
          # toolchain installed above, bypassing rust-toolchain.toml's
          # `channel = "1.95.0"`. Without it, maturin's `cargo metadata`
          # honours rust-toolchain.toml and auto-installs 1.95.0 WITH its
          # `[toolchain] components = [rustfmt, clippy]` — and on the
          # aarch64 musllinux container that clippy add collides with the
          # cargo-clippy binary `--profile default` already placed
          # ("failed to install component 'clippy-preview-...': detected
          # conflict: 'bin/cargo-clippy'"), failing the arm64 wheel build
          # (v0.3.22 release). The pinned toolchain is a lint-consistency
          # tool (CI fmt/clippy) — the wheel is a build artifact and builds
          # fine on stable (see CLAUDE.md's "build with RUSTUP_TOOLCHAIN=stable").
          CIBW_ENVIRONMENT_LINUX: 'PATH=/root/.cargo/bin:$PATH RUSTUP_TOOLCHAIN=stable'
          CIBW_BEFORE_BUILD: 'pip install maturin'
          CIBW_TEST_REQUIRES: 'pytest'
          CIBW_TEST_COMMAND: 'pytest {project}/crates/owl-dl-py/tests/python/'
        with:
          package-dir: crates/owl-dl-py
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'maturin>=1.7,<2'
      - name: Build sdist
        working-directory: crates/owl-dl-py
        run: maturin sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          # `maturin sdist` writes to the WORKSPACE target dir, not the
          # per-crate one, in a Cargo workspace. Path is relative to the
          # default working-directory (repo root), so target/wheels/ not
          # crates/owl-dl-py/target/wheels/. `if-no-files-found: error`
          # would have caught the silent-empty-artifact failure that
          # blocked the v0.2.0 first publish attempt.
          path: target/wheels/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rustdl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'wheels-*'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # No password / API token — PyPI trusted publisher OIDC

  github-release:
    name: GitHub Release
    needs: [build-wheels, build-sdist, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: 'wheels-*'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the `## [<version>] …` section, stopping at the next
          # `## [` heading and dropping the `[x.y.z]:` link-reference line.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/         { flag = 0 }
            flag && /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/ { next }
            flag                     { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="rustdl ${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "$title" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --title "$title" --notes-file release-notes.md dist/*
          fi
