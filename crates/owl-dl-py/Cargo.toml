[package]
name = "owl-dl-py"
description = "Python bindings for the rustdl OWL DL reasoner (via PyO3 + maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["owl", "ontology", "reasoner", "python", "pyo3"]
categories = ["science", "api-bindings"]
publish = false  # published via maturin → PyPI, not via cargo → crates.io

[lib]
name = "rustdl"           # Python import name: `import rustdl`
crate-type = ["cdylib"]   # Python C extension

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
owl-dl-reasoner.workspace = true
owl-dl-core.workspace = true
horned-owl.workspace = true
thiserror.workspace = true

# Same reason as owl-dl-cli (#139, #248): musl's default allocator serialises
# allocation behind a lock, which makes rayon-parallel classification ~10x
# slower. This covers the musllinux wheels; Rust-side allocations only, Python
# objects keep CPython's allocator. glibc, macOS and Windows keep the system one.
# `local_dynamic_tls` is REQUIRED here, unlike in owl-dl-cli: this crate is a
# dlopen'd extension, and musl refuses mimalloc's default initial-exec TLS in one
# ("initial-exec TLS resolves to dynamic definition" at `import rustdl`).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

# `extension-module` tells pyo3 not to link libpython (Python provides those
# symbols at runtime via dlopen). That's right for the actual Python
# extension (built by maturin) but breaks a plain `cargo test` binary, which
# has no Python process to resolve the symbols from and fails to link
# (see .github/workflows/ci.yml's `--exclude owl-dl-py` comment). Standard
# pyo3 workaround (https://pyo3.rs/main/faq): make it an opt-out default
# feature so `cargo test -p owl-dl-py --no-default-features` links cleanly,
# while a plain `cargo build`/maturin build (default features on) is
# unaffected.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
