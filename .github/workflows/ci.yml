name: CI

on:
  # Push trigger re-enabled 2026-06-11: the repo is now public, so GitHub
  # Actions runs on free public-repo minutes (the 2026-05-29 disable was a
  # private-repo billing failure, since resolved). PRs and manual dispatch
  # also trigger CI.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned toolchain (keep `toolchain:` in sync with rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned toolchain (keep `toolchain:` in sync with rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      # Pinned toolchain (keep `toolchain:` in sync with rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # owl-dl-py is a PyO3 `cdylib`; building it via plain `cargo` links it
      # as an ordinary lib, which fails on macOS (undefined `_PyExc_*` symbols
      # — Python symbols resolve at runtime, not at link). It is built and
      # tested by the dedicated `pytest` (maturin) job on every platform and
      # compile-checked by the clippy job, so exclude it from this matrix.
      - run: cargo build --workspace --all-targets --exclude owl-dl-py
      - run: cargo test --workspace --all-targets --exclude owl-dl-py
      - run: cargo test --workspace --doc --exclude owl-dl-py
      # NOTE: the exclusion above means owl-dl-py's Rust unit tests run ONLY in
      # python-ci.yml (which has a Python toolchain and so can put libpython on
      # the link path). If you add a Rust test to that crate, it is covered there
      # and nowhere else.

  musl:
    # The static Linux release binaries are musl builds, and since #241 they link
    # mimalloc (a C build via `libmimalloc-sys`). Without this job that path was
    # compiled only by release-cli.yml on a tag, so a mimalloc / `cc` bump or a
    # runner image change would first break a release (#248). Also checks the
    # musl build of owl-dl-py, whose musllinux wheels use the same allocator.
    name: musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Pinned toolchain (keep `toolchain:` in sync with rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --locked --target x86_64-unknown-linux-musl -p owl-dl-cli --bin rustdl
      # Run it: a broken allocator shows up as a crash, not just a link error.
      - run: target/x86_64-unknown-linux-musl/debug/rustdl classify bench-corpus/pizza.ofn > /dev/null
      - run: cargo check --locked --target x86_64-unknown-linux-musl -p owl-dl-py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Run cargo-deny on the runner, NOT the EmbarkStudios containerized
      # action: that action's musl container honours our `rust-toolchain.toml`
      # pin (1.95.0) but has no `1.95.0-*-musl` toolchain installed, so a
      # cargo-deny-action@v2 tag update (2026-06) started failing setup with
      # "override toolchain … is not installed". Installing the pinned toolchain
      # + a cargo-deny binary on the runner honours the pin correctly and dodges
      # the container. Keep `toolchain:` in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # `--workspace` is a global flag (before the subcommand) in current
      # cargo-deny; the old containerized action ran an older cargo-deny where
      # `check --workspace` parsed.
      - run: cargo deny --workspace check

  soundness-diff:
    name: closure-diff soundness net (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned toolchain (keep `toolchain:` in sync with rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # NOTE: fixtures must be provisioned by the runner (large, gitignored).
      # This job documents the entrypoint; provisioning is out of Phase 0 scope.
      - run: ./scripts/run-soundness-diff.sh
