name: Release CLI binaries

# Standalone from release-python.yml on purpose: a CLI-build failure must
# never block PyPI publishing. Both fire on the same v*.*.* tag; they share
# only the GitHub Release object, reconciled idempotently in publish-cli.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build rustdl ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools
          # Native ARM runner (ubuntu-24.04-arm, GA 2025) — no QEMU, ~4 min.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            apt: musl-tools
          - os: macos-14
            target: aarch64-apple-darwin
            apt: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            apt: ''
    env:
      # Build on stable regardless of rust-toolchain.toml's 1.95.0 lint pin
      # (see CLAUDE.md / release-python.yml). Strip line-tables debug info
      # that [profile.release] carries. Windows adds static CRT so no VC++
      # redistributable is needed on the user's machine.
      RUSTUP_TOOLCHAIN: stable
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6

      - name: Install musl build tools (Linux)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master, pinned
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Set RUSTFLAGS (unix)
        if: runner.os != 'Windows'
        run: echo "RUSTFLAGS=-C strip=symbols" >> "$GITHUB_ENV"

      - name: Set RUSTFLAGS (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C strip=symbols -C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: Build rustdl (release)
        run: cargo build --release --locked --target ${{ matrix.target }} -p owl-dl-cli --bin rustdl

      - name: Stage + smoke-test binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/rustdl" "staging/rustdl-${{ matrix.target }}"
          "target/${{ matrix.target }}/release/rustdl" --version

      - name: Stage + smoke-test binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/rustdl.exe" "staging/rustdl-${{ matrix.target }}.exe"
          "target/${{ matrix.target }}/release/rustdl.exe" --version

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  publish-cli:
    name: Attach binaries to the release
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/upload release assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'cli-*'
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum rustdl-* > SHA256SUMS
          cat SHA256SUMS

      - name: List staged assets
        run: ls -l dist

      - name: Attach to the GitHub Release
        # Only on a real tag; a workflow_dispatch dry run stops after building
        # + checksumming, leaving the four binaries as inspectable workflow
        # artifacts and touching no release.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # publish-cli has no checkout; gh needs the repo explicitly
        run: |
          tag="${GITHUB_REF_NAME}"
          # Idempotent + race-safe with release-python.yml's github-release job,
          # which also creates this release. Whichever workflow arrives first
          # creates a bare release; the loser's create is a harmless no-op
          # (|| true). release-python's github-release `edit` step later
          # overwrites the notes with the CHANGELOG section, so final notes are
          # always the CHANGELOG regardless of order. --clobber makes re-runs
          # (and asset name collisions across runs) safe.
          gh release create "$tag" --title "rustdl ${tag#v}" \
            --notes "Release ${tag}. See CHANGELOG.md for details." || true
          gh release upload "$tag" dist/rustdl-* dist/SHA256SUMS --clobber

  build-plugin:
    name: Build + attach the Protégé plugin jar
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          pattern: 'cli-*'
          path: cli-bins
          merge-multiple: true
      - name: Stage binaries into plugin resources
        run: |
          set -euo pipefail
          base=protege/src/main/resources/native
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            mkdir -p "$base/$triple"
            cp "cli-bins/rustdl-$triple" "$base/$triple/rustdl"
            chmod +x "$base/$triple/rustdl"
          done
          mkdir -p "$base/x86_64-pc-windows-msvc"
          cp "cli-bins/rustdl-x86_64-pc-windows-msvc.exe" "$base/x86_64-pc-windows-msvc/rustdl.exe"
          ls -R "$base"
      - name: Set plugin version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.0.0-dev"; fi
          mvn -B -f protege/pom.xml versions:set -DnewVersion="$ver" -DgenerateBackupPoms=false
      - name: Build the bundle jar
        # -Dtest widened to '*Test,*IT': Surefire's default include patterns
        # don't match RustdlSmokeIT.java, so a bare `package` would silently
        # skip it. With native/ staged and the runner linux-x64, the bundled
        # linux-x64 binary is what actually runs — exercising the real
        # bundled path (not just the -Drustdl.bin override), verifying
        # end-to-end bundling.
        run: mvn -B -f protege/pom.xml clean package -Dtest='*Test,*IT'
      - uses: actions/upload-artifact@v7
        with:
          name: protege-plugin
          path: protege/target/rustdl-protege-*.jar
          if-no-files-found: error
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # publish-cli has no checkout; gh needs the repo explicitly
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --title "rustdl ${tag#v}" \
            --notes "Release ${tag}. See CHANGELOG.md for details." || true
          gh release upload "$tag" protege/target/rustdl-protege-*.jar --clobber

  refresh-update-properties:
    name: Refresh Protégé auto-update descriptor on main
    needs: build-plugin
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the regenerated descriptor back to main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate protege/update.properties for this release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"; ver="${tag#v}"
          cat > protege/update.properties <<EOF
          # Protégé auto-update descriptor for the rustdl reasoner plugin.
          # Referenced by the bundle manifest's Update-Url header. Regenerated by
          # the release-cli.yml refresh-update-properties job on every v*.*.* tag —
          # do not hand-edit the version/download lines.
          id=nl.maastrichtuniversity.ids.rustdl
          version=${ver}
          name=rustdl Reasoner
          download=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/rustdl-protege-${ver}.jar
          readme=rustdl OWL 2 (SROIQ) reasoner as a Protege reasoner plugin. Bundles native binaries for Linux/macOS/Windows; no separate install.
          license=https://www.apache.org/licenses/LICENSE-2.0.txt
          author=Institute of Data Science, Maastricht University
          EOF
      - name: Commit + push if changed (best-effort, never fails the release)
        run: |
          if git diff --quiet -- protege/update.properties; then
            echo "update.properties already current for ${GITHUB_REF_NAME}"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protege/update.properties
          git commit -m "chore(protege): update.properties -> ${GITHUB_REF_NAME#v} [skip ci]"
          # rebase-and-retry once in case main advanced while the release ran
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; } || \
            echo "::warning::could not push update.properties (non-fatal); update it manually"
