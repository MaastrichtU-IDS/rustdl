name: Python CI

on:
  # push trigger re-enabled 2026-06-22 — the Python suite must run on
  # merges to main, not just PRs/dispatch (a stub-test regression slipped
  # to main and was first caught only by the v0.3.11 release wheel build,
  # because this trigger was off). Path-filtered so it fires only when the
  # Python package or its Rust deps change.
  push:
    branches: [main]
    paths:
      - 'crates/owl-dl-py/**'
      - 'crates/owl-dl-core/**'
      - 'crates/owl-dl-saturation/**'
      - 'crates/owl-dl-tableau/**'
      - 'crates/owl-dl-datatypes/**'
      - 'crates/owl-dl-reasoner/**'
      - 'Cargo.toml'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'crates/owl-dl-py/**'
      - 'crates/owl-dl-core/**'
      - 'crates/owl-dl-saturation/**'
      - 'crates/owl-dl-tableau/**'
      - 'crates/owl-dl-datatypes/**'
      - 'crates/owl-dl-reasoner/**'
      - 'Cargo.toml'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pytest
        run: pip install pytest
      - name: Build + install rustdl
        # `pip install <crate-dir>` drives the maturin build backend via
        # PEP 517 and installs the wheel into the runner's active Python.
        # (`maturin develop` is NOT used here: it requires an activated
        # virtualenv — there's none on the CI runner — and fails with
        # "Couldn't find a virtualenv or conda environment".)
        run: pip install ./crates/owl-dl-py
      - name: Run pytest
        run: pytest crates/owl-dl-py/tests/python/ -v
      # The crate's Rust unit tests are otherwise NEVER RUN: ci.yml excludes
      # owl-dl-py from `cargo test` (a PyO3 `cdylib` fails to link as an ordinary
      # test binary), and pytest exercises only the Python surface. So
      # `explain::tests::render_manchester_renders_subclass_chain` — a pure-Rust
      # test that writes an `.ofn` and checks the Manchester rendering, with no
      # Python involved — had zero CI coverage.
      #
      # `--no-default-features` drops `pyo3/extension-module`, which is what makes
      # a normal test binary linkable at all; it then needs libpython on the link
      # path, which is NOT in the default search path even when Python is
      # installed (`sysconfig` reports `LIBDIR` but the bare `libpython3.X.so`
      # symlink lives in `LIBPL`). Hence the explicit `-L`. Verified locally:
      # without it the link fails with `unable to find library -lpython3.10`.
      - name: Run owl-dl-py Rust unit tests
        run: |
          LIBPL="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBPL"))')"
          RUSTFLAGS="-L $LIBPL" cargo test -p owl-dl-py --no-default-features
