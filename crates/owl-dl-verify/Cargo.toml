[package]
name = "owl-dl-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Published since 0.4.30: #126 flipped owl-dl-cli back to publishable, which made
# this crate a dependency of a published crate — the exact "revisit" condition the
# old `publish = false` comment named. Nobody re-ran publish preflight between
# #126 and the v0.4.29 tag (it is tag-triggered), so 0.4.29's crates preflight was
# the first to see the combination, and failed. The description below carries the
# caveat that used to justify staying unpublished: verdicts are diagnostic leads,
# not proofs.
description = """Diagnostic verification harness for the rustdl OWL 2 DL reasoner. \
A `Violated` verdict is a lead requiring adjudication against a peer reasoner, \
not a proof of unsoundness."""

[dependencies]
owl-dl-core = { workspace = true }
owl-dl-saturation = { workspace = true }
hashbrown = { workspace = true }

[dev-dependencies]
horned-owl = { workspace = true }
# Only for tests (comparing rustdl's own classification against the committed
# oracles in `tests/acceptance.rs`) — NOT a `[dependencies]` entry, so this
# creates no cycle: `owl-dl-reasoner` does not depend on `owl-dl-verify`, and
# `src/` still never imports it (see `src/eval.rs`'s independence contract).
owl-dl-reasoner = { workspace = true }
# Self-dependency trick: requests this crate's own `test-mutations` feature
# for the INTEGRATION test binaries under `tests/`. A plain `#[cfg(test)]`
# on `FiniteModel::test_only_remove_from_label` is invisible there — that
# cfg is true only while compiling the crate's OWN unit tests, and
# `tests/*.rs` link against `owl-dl-verify` as an external dependency. This
# entry makes cargo build the library with the feature on for test targets
# specifically, while a plain `cargo build -p owl-dl-verify` (no dev-deps)
# never enables it, so the mutator stays unreachable from production code.
owl-dl-verify = { path = ".", features = ["test-mutations"] }

[features]
# Gates `FiniteModel::test_only_remove_from_label` for integration tests.
# See the dev-dependency comment above for why this exists.
test-mutations = []

[lints]
workspace = true
