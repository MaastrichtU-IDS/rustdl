[package]
name = "owl-dl-cli"
description = "Command-line interface for the rustdl OWL DL reasoner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# NOT publishable — but the horned-owl reason recorded here until 2026-09-05 is
# RESOLVED and was replaced by the real one.
#
# WAS: `io::omn` / `AsManchester` existed only in the `[patch.crates-io]` fork, so
# a consumer resolving upstream hit E0432 `unresolved import horned_owl::io::omn`.
# That is gone: the fork and the patch are dropped, this workspace pins released
# horned-owl 3.0, and BOTH `io::omn` and the per-item `AsManchester` trait ship in
# it (the issue's "AsManchester is fork-only" claim was a bad docs.rs probe —
# 3.0.0 has it, ahead of the fork).
#
# ACTUAL remaining blocker, measured with `cargo publish --dry-run -p owl-dl-cli`:
#
#     no matching package named `owl-dl-verify` found
#
# this crate depends on `owl-dl-verify`, which is itself `publish = false`, and
# cargo refuses to publish a crate with an unpublished dependency. Flipping this
# to `true` therefore requires first deciding to publish `owl-dl-verify` — i.e.
# committing to a public API for a diagnostic-only crate — which is a separate
# call from the horned-owl upgrade. Tracked in #99.
#
# Distribution meanwhile is the GitHub Release binaries built by
# .github/workflows/release-cli.yml.
publish = false

[[bin]]
name = "rustdl"
path = "src/main.rs"

[dependencies]
owl-dl-core.workspace = true
owl-dl-reasoner.workspace = true
owl-dl-verify.workspace = true
horned-owl.workspace = true
clap.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
